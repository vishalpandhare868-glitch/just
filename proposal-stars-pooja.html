<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Written in the Stars, for Pooja</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#fff3f0;--gold:#ffd166;--pink:#ff8fab;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{height:100%;margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;flex-direction:column;color:var(--cream);font-family:"Poppins",system-ui,sans-serif;
    background:linear-gradient(115deg,transparent 38%,rgba(255,150,200,.11) 50%,transparent 62%),linear-gradient(180deg,#07051c 0%,#1b0b3d 45%,#4a1656 78%,#7a2060 100%)}
  .ser{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0}
  header{flex:none;position:relative;z-index:2;pointer-events:none;text-align:center;padding:14px 56px 0}
  #sm{font-size:clamp(16px,3.8vw,22px);color:#ffd3df}
  #nm{display:inline-block;font-family:"Great Vibes",cursive;font-size:clamp(52px,12.5vw,90px);line-height:1.1;padding:.02em .14em .12em;
    background:linear-gradient(100deg,#ffd6e0 0%,#ff8fab 30%,#fff 50%,#ffd166 70%,#ffd6e0 100%);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 3px 12px rgba(255,90,150,.45))}
  @keyframes shine{to{background-position:-250% 0}}
  #stage{flex:1;min-height:0;pointer-events:none}
  #card{flex:none;position:relative;z-index:2;box-sizing:border-box;width:min(92%,560px);min-height:196px;margin:0 auto 14px;padding:14px 20px 12px;border-radius:22px;text-align:center;
    background:rgba(26,8,48,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,170,210,.32);box-shadow:0 10px 40px rgba(0,0,0,.4)}
  #tag{font:500 10px "Poppins",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--pink);transition:opacity .4s}
  #txt{margin:8px 0 8px;font-size:clamp(20px,4.8vw,26px);line-height:1.4;min-height:4.2em;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
  body.ask #txt{font-size:clamp(26px,6.6vw,36px);font-weight:600}
  #row{min-height:54px;display:flex;align-items:center;justify-content:center}
  #dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  #dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,230,240,.22);transition:background .5s,box-shadow .5s}
  #dots i.on{background:var(--pink);box-shadow:0 0 8px var(--pink)}
  #btns{display:none;gap:14px;align-items:center;justify-content:center}
  #yes{border:0;cursor:pointer;padding:12px 22px;border-radius:99px;font:500 14px "Poppins",sans-serif;color:#3a0a24;background:linear-gradient(100deg,#ffb3c7,#ffd166);
    box-shadow:0 0 22px rgba(255,140,190,.6);transform:scale(var(--ys,1));transition:transform .4s}
  #no{border:1px solid rgba(255,230,240,.45);background:none;color:var(--cream);padding:10px 16px;border-radius:99px;font:300 12px "Poppins",sans-serif;cursor:pointer}
  #again{display:none;border:1px solid rgba(255,230,240,.45);background:none;color:var(--cream);padding:7px 15px;border-radius:99px;font:500 10px "Poppins",sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  body.ask #dots,body.yes #dots{display:none} body.ask #btns{display:flex} body.yes #again{display:block}
  #snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:6;border:0;background:rgba(255,255,255,.14);color:var(--cream);width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><div id="sm" class="ser">a love story, written in the stars, for</div><div id="nm"></div></header>
<div id="stage"></div>
<div id="card"><div id="tag">a little something for you</div><div id="txt" class="ser">tap the glowing star, then the next, and the next</div>
  <div id="row"><div id="dots"></div><div id="btns"><button id="yes">Yes, always 💖</button><button id="no">Let me think…</button></div><button id="again">watch again</button></div></div>
<button id="snd" aria-label="Toggle sound">🔊</button>

<script>
// ✏️ PERSONALISE HERE (or open the page with ?to=Name)
const NAME = new URLSearchParams(location.search).get('to') || 'Pooja';
const MSGS = [
  'From the very first day, something in me knew.',
  'You are the calm in my busiest days.',
  'Every little thing feels brighter with you in it.',
  'My favourite place in the world is wherever you are.',
  'You are my best friend, and so much more.',
  'I fell for your smile, and I stayed for your heart.',
  'With you, ordinary days feel like festivals.',
  'You laugh with me, you stand by me, and that is everything.',
  'I want every sunrise and every sunset with you.',
  'Through every season, I want to be yours.',
  'You are the answer to every wish I ever made.',
  'So tonight, under all these stars…'
];
const NOS = ['Are you sure? 🥺','Please think again… 💗','Pretty please? 🌹','My heart is waiting…','Okay, I will wait forever 💫'];
const NOTES = [392,440,494,523,587,659,698,784,880,988,1047,1175];
const $ = id => document.getElementById(id);
$('nm').textContent = NAME; document.title = 'Written in the Stars, for ' + NAME;
$('dots').innerHTML = MSGS.map(()=>'<i></i>').join('');

let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,t0,dur,type,vol){ const a=ac(); if(!a||muted)return; const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.1,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05); }
const SONG=[[392,1],[494,1],[587,1.5],[494,.5],[440,1],[494,1],[392,2],[330,1],[392,1],[494,1.5],[440,.5],[392,1],[370,1],[294,2],[330,1],[392,1],[494,1.5],[587,.5],[659,3]];
function playSong(){ let t=0; const bt=.6; SONG.forEach(([f,b])=>{ setTimeout(()=>{ tone(f,0,b*bt*1.7,'sine',.1); tone(f*2,0,b*bt,'sine',.03); },t*1000); t+=b*bt; }); }
$('snd').addEventListener('click',e=>{ muted=!muted; e.target.textContent=muted?'🔇':'🔊'; });

const cv=$('c'), ctx=cv.getContext('2d'), stage=$('stage');
let W=0,H=0,dpr=1,k=1,cx=0,cy=0,pts=[],outline=[],nxt=0,lines=[],phase=0,hg=0,parts=[],shoot=[],T=0,down=false,noN=0,fwT=0;
const bgStars=[...Array(110)].map(()=>({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.3,ph:Math.random()*6}));

function layout(){
  const sr=stage.getBoundingClientRect(); k=Math.min(W*.42/16,sr.height*.44/14.5); cx=W/2; cy=sr.top+sr.height*.5;
  const P=t=>({x:cx+16*Math.pow(Math.sin(t),3)*k, y:cy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)+2.5)*k});
  pts=[...Array(12)].map((_,i)=>P(Math.PI+i*Math.PI/6)); outline=[...Array(97)].map((_,i)=>P(i/96*Math.PI*2));
}
function resize(){ dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); layout(); }
addEventListener('resize',resize); new ResizeObserver(resize).observe(stage); resize();

function glint(x,y,r,a){ ctx.fillStyle='rgba(255,246,225,'+a+')'; ctx.beginPath(); ctx.moveTo(x,y-r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r); ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r); ctx.fill(); }
function heartShape(x,y,s){ ctx.beginPath(); ctx.moveTo(x,y+s*.35); ctx.bezierCurveTo(x-s,y-s*.2,x-s*.5,y-s*.9,x,y-s*.4); ctx.bezierCurveTo(x+s*.5,y-s*.9,x+s,y-s*.2,x,y+s*.35); ctx.fill(); }
function sparks(x,y,n,cols,sp){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, v=(sp||40)+Math.random()*(sp?sp*1.3:140);
  parts.push({t:'s',x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:90,life:.7+Math.random()*.8,age:0,c:cols[i%cols.length],a:1}); } }
function hearts(x,y,n,spread){ for(let i=0;i<n;i++) parts.push({t:'h',x,y,vx:(Math.random()-.5)*spread,vy:-60-Math.random()*140,g:40,life:2.2+Math.random()*1.5,age:0,s:7+Math.random()*12,
  c:['#ff6fa5','#ff8fab','#ffd166','#ffffff','#ff4d88'][(Math.random()*5)|0],ph:Math.random()*6,a:1}); }
function firework(x,y){ tone(80,0,.5,'triangle',.12); tone(1600+Math.random()*700,.05,.2,'sine',.03);
  sparks(x,y,70,[['#ffd166','#fff3b0'],['#ff8fab','#ffd6e0'],['#c77dff','#ffffff']][(Math.random()*3)|0],110); hearts(x,y,6,160); }

function show(tag,text){ const t=$('tag'),x=$('txt'); t.style.opacity=x.style.opacity=0; setTimeout(()=>{ t.textContent=tag; x.textContent=text; t.style.opacity=x.style.opacity=1; },300); }
function connect(){
  const s=nxt++, p=pts[s]; if(s>0) lines.push({a:s-1,b:s,p:0});
  $('dots').children[s].classList.add('on'); show('star '+(s+1)+' of 12',MSGS[s]);
  tone(NOTES[s],0,1.1,'sine',.1); tone(NOTES[s]*2,.05,.6,'sine',.03); sparks(p.x,p.y,14,['#ffd166','#ffffff','#ff8fab']);
  if(nxt===12){ lines.push({a:11,b:0,p:0}); phase=1; setTimeout(ask,4600); }
}
function ask(){ phase=2; show('a question from my heart',NAME+', will you be mine?'); document.body.classList.add('ask'); tone(659,0,1.2,'sine',.1); tone(988,.15,1.2,'sine',.06); }
function hit(px,py){ if(phase!==0) return false; const p=pts[nxt]; if(Math.hypot(px-p.x,py-p.y)<Math.max(38,k*2.6)){ connect(); return true; } return false; }
cv.addEventListener('pointerdown',e=>{ ac(); down=true; if(phase===3) hearts(e.clientX,e.clientY,8,120); else if(!hit(e.clientX,e.clientY)&&phase===0) sparks(e.clientX,e.clientY,5,['#fff6dc'],30); });
cv.addEventListener('pointermove',e=>{ if(down) hit(e.clientX,e.clientY); });
addEventListener('pointerup',()=>down=false); addEventListener('pointercancel',()=>down=false);

$('yes').addEventListener('click',()=>{
  ac(); phase=3; document.body.classList.remove('ask'); document.body.classList.add('yes');
  show('forever & always','You just made me the happiest person alive. I love you, '+NAME+', today and always.'); playSong(); hearts(cx,cy,70,320);
  [0,350,700].forEach(ms=>setTimeout(()=>firework(W*(.2+.6*Math.random()),H*(.15+.3*Math.random())),ms));
});
$('no').addEventListener('click',()=>{ noN++; if(noN>NOS.length) $('no').style.display='none'; else $('no').textContent=NOS[noN-1];
  $('yes').style.setProperty('--ys',1+noN*.1); tone(300,0,.2,'sine',.06); });
$('again').addEventListener('click',()=>{
  phase=0; nxt=0; lines=[]; hg=0; parts=[]; noN=0; document.body.classList.remove('ask','yes');
  [...$('dots').children].forEach(i=>i.classList.remove('on')); $('no').style.display=''; $('no').textContent='Let me think…'; $('yes').style.setProperty('--ys',1);
  show('a little something for you','tap the glowing star, then the next, and the next');
});

let last=performance.now();
function frame(now){
  const dt=Math.min(.04,(now-last)/1000); last=now; T+=dt; ctx.clearRect(0,0,W,H);
  for(const s of bgStars){ ctx.fillStyle='rgba(255,240,235,'+(.75*(.35+.65*Math.abs(Math.sin(T*.8+s.ph))))+')'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,7); ctx.fill(); }
  const mx=W*.87, my=Math.max(60,cy-k*15), mg=ctx.createRadialGradient(mx,my,4,mx,my,60);          // crescent moon
  mg.addColorStop(0,'rgba(255,240,210,.35)'); mg.addColorStop(1,'rgba(255,240,210,0)'); ctx.fillStyle=mg; ctx.fillRect(mx-60,my-60,120,120);
  ctx.fillStyle='#fff3d6'; ctx.beginPath(); ctx.arc(mx,my,15,0,7); ctx.fill(); ctx.fillStyle='#2a1048'; ctx.beginPath(); ctx.arc(mx+7,my-4,13,0,7); ctx.fill();
  if(Math.random()<(phase>=1?.03:.004)) shoot.push({x:W*(.3+.7*Math.random()),y:-10+Math.random()*H*.3,vx:-(320+Math.random()*200),vy:160+Math.random()*100,age:0});
  shoot=shoot.filter(s=>(s.age+=dt)<1.1);
  for(const s of shoot){ s.x+=s.vx*dt; s.y+=s.vy*dt; const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*.14,s.y-s.vy*.14); g.addColorStop(0,'rgba(255,255,255,'+(1-s.age)+')'); g.addColorStop(1,'rgba(255,200,230,0)');
    ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*.14,s.y-s.vy*.14); ctx.stroke(); }
  if(phase>=1){ hg=Math.min(1,hg+dt*.5); const pul=1+.12*Math.sin(T*3), e=hg*hg*(3-2*hg);          // the finished heart
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,k*17); g.addColorStop(0,'rgba(255,110,170,'+.3*e*pul+')'); g.addColorStop(1,'rgba(255,110,170,0)');
    ctx.beginPath(); outline.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='rgba(255,175,210,'+.55*e+')'; ctx.lineWidth=2; ctx.stroke();
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=(k*3.4)+'px "Great Vibes",cursive'; ctx.shadowColor='rgba(255,100,160,.9)'; ctx.shadowBlur=18;
    ctx.fillStyle='rgba(255,240,244,'+e+')'; ctx.fillText('I love you',cx,cy-k*.5); ctx.restore(); }
  for(const l of lines){ l.p=Math.min(1,l.p+dt*2.2); const A=pts[l.a],B=pts[l.b],ex=A.x+(B.x-A.x)*l.p,ey=A.y+(B.y-A.y)*l.p;
    ctx.lineCap='round'; ctx.strokeStyle='rgba(255,140,190,.25)'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle='rgba(255,228,238,.95)'; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(ex,ey); ctx.stroke(); }
  pts.forEach((p,i)=>{ const on=i<nxt;
    if(on){ const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,26); g.addColorStop(0,'rgba(255,200,225,.55)'); g.addColorStop(1,'rgba(255,200,225,0)'); ctx.fillStyle=g; ctx.fillRect(p.x-26,p.y-26,52,52); glint(p.x,p.y,10+2*Math.sin(T*4+i),1); }
    else if(i===nxt&&phase===0){ const r=16+4*Math.sin(T*4); ctx.strokeStyle='rgba(255,209,102,'+(.5+.3*Math.sin(T*4))+')'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.stroke();
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,30); g.addColorStop(0,'rgba(255,209,102,.6)'); g.addColorStop(1,'rgba(255,209,102,0)'); ctx.fillStyle=g; ctx.fillRect(p.x-30,p.y-30,60,60); glint(p.x,p.y,9,1); }
    else glint(p.x,p.y,3.5,.45); });
  if(Math.random()<.03) parts.push({t:'h',x:Math.random()*W,y:H+10,vx:0,vy:-25-Math.random()*25,g:0,life:12,age:0,s:4+Math.random()*5,c:'#ff8fab',ph:Math.random()*6,a:.35});
  if(phase===3&&(fwT-=dt)<0){ fwT=.9+Math.random()*1.1; firework(W*(.12+.76*Math.random()),H*(.12+.35*Math.random())); }
  parts=parts.filter(p=>(p.age+=dt)<p.life);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const p of parts){ p.px=p.x; p.py=p.y; p.vy+=p.g*dt; p.x+=(p.vx+(p.t==='h'?Math.sin(T*2+p.ph)*18:0))*dt; p.y+=p.vy*dt; ctx.globalAlpha=Math.max(0,1-p.age/p.life)*p.a;
    if(p.t==='s'){ ctx.strokeStyle=p.c; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x+.01,p.y); ctx.stroke(); } else { ctx.fillStyle=p.c; heartShape(p.x,p.y,p.s); } }
  ctx.restore(); ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
